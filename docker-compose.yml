services:
  aihat-bot-factory:
    build:
      context: .
      dockerfile: Dockerfile
    image: aihat-bot-factory:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/aihat.sqlite
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    stop_grace_period: ${STOP_GRACE_PERIOD:-5m}
    volumes:
      - aihat_data:/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  clamav:
    profiles: ["clamav"]
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable-debian13-slim}
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=3", "--wait", "/etc/hostname"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s

  scanner-gateway-proxy:
    profiles: ["scanner-gateway"]
    image: caddy:2.11.4-alpine
    environment:
      FILE_SCANNER_GATEWAY_DOMAIN: ${FILE_SCANNER_GATEWAY_DOMAIN:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      aihat-bot-factory:
        condition: service_started
      clamav:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true

volumes:
  aihat_data:
  clamav_signatures:
  caddy_data:
  caddy_config:
