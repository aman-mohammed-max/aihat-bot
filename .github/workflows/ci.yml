name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type check and lint
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Build Bun and Cloudflare runtimes
        run: bun run build

      - name: Check formatting
        run: bun run format:check

      - name: Validate default and scanner Docker Compose profiles
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null --profile clamav --profile scanner-gateway config --quiet

  dependency-scan:
    name: Scan locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan bun.lock with OSV Scanner
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/src:ro"
          --workdir /src
          ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --lockfile /src/bun.lock
