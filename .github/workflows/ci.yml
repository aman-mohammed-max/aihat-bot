name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type check and lint
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Build Bun and Cloudflare runtimes
        run: bun run build

      - name: Check formatting
        run: bun run format:check

      - name: Validate default and scanner Docker Compose profiles
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null --profile clamav --profile scanner-gateway config --quiet

  dependency-scan:
    name: Scan locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan bun.lock with OSV Scanner
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/src:ro"
          --workdir /src
          ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --lockfile /src/bun.lock

  container-image:
    name: Build and scan Bun image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build self-hosted runtime image
        run: docker build --tag aihat-bot-factory:ci .

      - name: Smoke test runtime in a read-only container
        run: |
          set -e
          cleanup() { docker stop aihat-bot-factory-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --rm --name aihat-bot-factory-smoke \
            --publish 127.0.0.1:13000:3000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001 \
            --env APP_ENV=production \
            --env HOST=0.0.0.0 \
            --env PORT=3000 \
            --env DATABASE_PATH=/data/aihat.sqlite \
            --env OBJECTS_PATH=/data/objects \
            aihat-bot-factory:ci >/dev/null
          ready=0
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:13000/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs aihat-bot-factory-smoke
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:13000/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:13000/miniapp/ >/dev/null

      - name: Export image for scanning
        run: docker save aihat-bot-factory:ci --output "${RUNNER_TEMP}/aihat-bot-factory-ci.tar"

      - name: Scan runtime image with OSV Scanner
        run: >-
          docker run --rm
          --volume "${RUNNER_TEMP}:/input:ro"
          --workdir /tmp
          ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan image --archive /input/aihat-bot-factory-ci.tar
